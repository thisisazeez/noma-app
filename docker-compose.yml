version: "3.8"

services:
  web:
    build: .
    volumes:
      - .:/code:rw
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=noma.settings
      - PYTHONUNBUFFERED=1
    # entrypoint handles migrations, superuser creation and starting gunicorn
    restart: unless-stopped

volumes:
  static_volume:
  media_volume:
