
services:
  web:
    build: .
    container_name: noma_web
    command: gunicorn noma.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - .:/code:rw
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    expose:
      - "8000"
    environment:
      - DJANGO_SETTINGS_MODULE=noma.settings
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  nginx:
    image: nginx:latest
    container_name: noma_nginx
    expose:
      - "80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/code/staticfiles
      - media_volume:/code/media
    depends_on:
      - web
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: noma_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - nginx

volumes:
  static_volume:
  media_volume:
  caddy_data:
  caddy_config:
